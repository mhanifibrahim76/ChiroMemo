  />
  <path
    d="M32 10V26.5"
    stroke="#FAF8F4"
    stroke-width="3.8"
    stroke-linecap="round"
  />
  <circle cx="32" cy="28.5" r="3.4" fill="#F59E0B" />

  <!-- Brand Wordmark: ChiroMemo -->
  <text
    x="80"
    y="44"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="36"
    letter-spacing="-0.03em"
  >
    <tspan font-weight="800" fill="#1C1917">Chiro</tspan><tspan font-weight="600" fill="#166534">Memo</tspan>
  </text>
</svg>

